name: governance-audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  standing-orders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Auditor fixture tests
        run: python3 tools/test_standing_orders_audit.py
      - name: Standing Orders CI gate
        run: python3 tools/standing_orders_audit.py --profile ci
